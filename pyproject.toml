[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img2mesh"
version = "0.1.0"
description = "Multi-view 3D reconstruction and surface meshing from overlapping photographs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=12.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.13,<5",
    "scipy>=1.16",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Repository = "https://github.com/aidnth14/img2mesh"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Building benchmark datasets from glTF/GLB scans (img2mesh.benchmark.meshdata).
benchmark = [
    "trimesh>=4.0",
]
# Learned background removal (masker="rembg").
masks = [
    "rembg>=2.0",
    "onnxruntime>=1.16",
]

[project.scripts]
img2mesh = "img2mesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
